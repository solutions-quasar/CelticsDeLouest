<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du mot de passe | Celtics ERP</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="importmap">
        {
          "imports": {
            "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
          }
        }
    </script>
</head>

<body>
    <div class="screen active" style="background: white;">
        <div class="login-box">
            <div class="logo-area">
                <img src="images/logo.png" alt="Celtics Logo">
                <h1>Réinitialisation</h1>
            </div>

            <!-- Loading State -->
            <div id="loading-state" style="text-align: center; padding: 40px;">
                <i class="fas fa-circle-notch fa-spin" style="font-size: 3rem; color: var(--primary);"></i>
                <p style="margin-top: 20px; color: #666;">Vérification du lien...</p>
            </div>

            <!-- Reset Form -->
            <div id="reset-form-container" style="display: none;">
                <form id="reset-form">
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="new-password" placeholder="Nouveau mot de passe" required
                            minlength="6">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirm-password" placeholder="Confirmer le mot de passe" required
                            minlength="6">
                    </div>
                    <p style="font-size: 0.85rem; color: #666; margin: 10px 0;">
                        Le mot de passe doit contenir au moins 6 caractères.
                    </p>
                    <button type="submit" class="btn-login">
                        <i class="fas fa-check"></i> Réinitialiser
                    </button>
                    <p id="reset-error" class="error-msg"></p>
                </form>
            </div>

            <!-- Success State -->
            <div id="reset-success" style="display: none; text-align: center;">
                <i class="fas fa-check-circle" style="font-size: 4rem; color: #27ae60; margin-bottom: 20px;"></i>
                <h3>Mot de passe réinitialisé !</h3>
                <p style="color: #666; margin: 20px 0;">Vous pouvez maintenant vous connecter avec votre nouveau mot de
                    passe.</p>
                <a href="./index.html" class="btn-login"
                    style="display: inline-block; margin-top: 20px; text-decoration: none;">
                    <i class="fas fa-sign-in-alt"></i> Se connecter
                </a>
            </div>

            <!-- Error State -->
            <div id="error-state" style="display: none; text-align: center;">
                <i class="fas fa-exclamation-triangle"
                    style="font-size: 4rem; color: #e74c3c; margin-bottom: 20px;"></i>
                <h3>Lien invalide ou expiré</h3>
                <p id="error-message" style="color: #666; margin: 20px 0;"></p>
                <a href="./index.html" class="btn-login"
                    style="display: inline-block; margin-top: 20px; text-decoration: none; background: #6c757d;">
                    <i class="fas fa-arrow-left"></i> Retour à la connexion
                </a>
            </div>
        </div>
    </div>

    <script type="module" src="./js/reset-password.js"></script>
</body>

</html>
